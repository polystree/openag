  <rect width="256" height="256" rx="56" fill="url(#bg)" stroke="#26293d" stroke-width="2" />
  <circle cx="128" cy="128" r="70" fill="#6366f1" opacity="0.12" filter="url(#glow)" />
  <ellipse cx="128" cy="128" rx="95" ry="38" transform="rotate(-28 128 128)" fill="none" stroke="url(#ring1)" stroke-width="4.5" />
  <ellipse cx="128" cy="128" rx="95" ry="38" transform="rotate(35 128 128)" fill="none" stroke="url(#ring2)" stroke-width="3.5" stroke-dasharray="14 6" />
  <circle cx="128" cy="128" r="42" fill="url(#core)" filter="url(#glow)" />
  <circle cx="112" cy="112" r="12" fill="#ffffff" opacity="0.35" />
  <circle cx="148" cy="148" r="4" fill="#06b6d4" />
